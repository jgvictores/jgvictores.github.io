name: Build CV and Deploy Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Grants permissions to upload to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensures only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-extra-utils texlive-luatex

      - name: Build PDF and HTML CV
        working-directory: ./cv
        run: |
          # Apply BibTeX cleanups
          sed -i '/   note = {/d' victores.bib
          sed -i "s/@inbook/@incollection/g" victores.bib
          sed -i "s/@article{victores2014thesis/@phdthesis{victores2014thesis/g" victores.bib
          
          # Compile the LaTeX document
          pdflatex JuanGVictoresCV.tex
          pdflatex JuanGVictoresCV.tex
          bibtex JuanGVictoresCV.aux
          pdflatex JuanGVictoresCV.tex
          pdflatex JuanGVictoresCV.tex
          
          # Generate the HTML
          make4ht -u JuanGVictoresCV.tex

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
